name: Build Cobweb Farben mod

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'CobwebFarben/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Build mod
        run: gradle --no-daemon -p CobwebFarben clean build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: cobwebfarben-1.0.0
          path: CobwebFarben/build/libs/cobwebfarben-1.0.0.jar
          if-no-files-found: error
